{% extends 'base.html' %}

{% block title %}404 — Page Not Found | MVR Associates{% endblock %}

{% block content %}
<section class="section section-lg bg-surface text-center">
  <div class="container" style="max-width: 650px;">
    <div class="mb-4">
      <span class="badge badge-gold" style="font-size: 1rem; padding: 0.5rem 1.25rem;">Error 404</span>
    </div>
    <h1 class="text-display mb-4">Page Not Found</h1>
    <p class="text-lead text-muted mb-6">
      The requested page could not be located. It may have been moved, renamed, or is temporarily unavailable.
    </p>
    <div class="flex justify-center" style="gap: 1rem;">
      <a href="{{ url_for('main.index') }}" class="btn btn-gold">Return to Homepage</a>
      <a href="{{ url_for('services.index') }}" class="btn btn-secondary">Explore Services</a>
    </div>
  </div>
</section>
{% endblock %}
