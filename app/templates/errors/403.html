{% extends 'base.html' %}

{% block title %}403 — Access Forbidden | MVR Associates{% endblock %}

{% block content %}
<section class="section section-lg bg-surface text-center">
  <div class="container" style="max-width: 650px;">
    <div class="mb-4">
      <span class="badge badge-gold" style="font-size: 1rem; padding: 0.5rem 1.25rem;">Error 403</span>
    </div>
    <h1 class="text-display mb-4">Access Restricted</h1>
    <p class="text-lead text-muted mb-6">
      You do not have administrative privileges to access this area.

    <div class="flex justify-center" style="gap: 1rem;">
      <a href="{{ url_for('main.index') }}" class="btn btn-gold">Return to Homepage</a>
    </div>
  </div>
</section>
{% endblock %}
